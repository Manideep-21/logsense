# LogSense — Stage 1: the four services.
# Start:  docker compose up -d      Check: docker compose ps
# Stop:   docker compose stop       (keeps data inside the containers)
# Remove: docker compose down       (deletes Kafka messages and Hive table definitions)

services:
  # Kafka: the message queue. Single node in KRaft mode (no Zookeeper).
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    ports:
      - "9094:9094"            # for scripts running in WSL, use localhost:9094
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # PLAINTEXT = other containers (kafka:9092), EXTERNAL = your WSL shell (localhost:9094)
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 20s
      retries: 10
      start_period: 20s

  # Spark: kept idle; we run jobs inside it later with spark-submit (local mode).
  spark:
    build: ./spark             # apache/spark:3.5.6 + a user with your id (see spark/Dockerfile)
    image: logsense-spark:3.5.6
    container_name: spark
    command: ["tail", "-f", "/dev/null"]
    volumes:
      - ./jobs:/opt/jobs                 # our Spark scripts
      - ./warehouse:/data/warehouse      # shared output folder (Hive reads this too)
      - ./data:/data/input:ro            # log subset + anomaly labels (read-only)
      - ./.ivy2:/home/logsense/.ivy2     # cache for downloaded Spark packages (Kafka connector)
    ports:
      - "4040:4040"            # Spark web UI (only while a job is running)
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "test", "-x", "/opt/spark/bin/spark-submit"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Hive: HiveServer2 with a built-in (embedded Derby) metastore. SQL on port 10000.
  hive:
    image: apache/hive:4.0.1
    container_name: hive
    environment:
      SERVICE_NAME: hiveserver2
      HADOOP_HEAPSIZE: "1024"
      # Keep the "already running" PID file in a folder that is wiped on every start,
      # otherwise a stopped-then-started container refuses to boot ("Stop it first").
      HIVESERVER2_PID_DIR: /tmp/hs2pid
    tmpfs:
      - /tmp/hs2pid:mode=1777
    volumes:
      - ./warehouse:/data/warehouse      # same shared folder, same path as in Spark
      - ./hive:/opt/hive-scripts:ro      # our CREATE TABLE scripts
    ports:
      - "10000:10000"          # JDBC / beeline
      - "10002:10002"          # HiveServer2 web UI
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "/opt/hive/bin/beeline -u jdbc:hive2://localhost:10000 -e 'show databases;' >/dev/null 2>&1"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 60s

  # Qdrant: the vector database for semantic search.
  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: qdrant
    ports:
      - "6333:6333"            # REST API + dashboard at http://localhost:6333/dashboard
    volumes:
      - qdrant_data:/qdrant/storage
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  qdrant_data:
